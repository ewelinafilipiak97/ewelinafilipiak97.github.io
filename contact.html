<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
}

.navbar{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;

    display: flex;
    justify-content: center;
    gap: 40px;

    padding: 20px 0;

    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px);

    z-index: 1000;
}

.navbar a{
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;

    transition: 0.3s;
}

.navbar a:hover{
    color: #c9a86a;
}
    
.contact-section{
    min-height:100vh;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.45),
            rgba(0,0,0,0.45)
        ),
        url("1280px-Théodore_GUDIN_-_Le_naufrage.jpg");

    background-size:cover;
    background-position:center;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:white;
}

.contact-section h1{
    font-size:6rem;
    font-weight:900;
    margin-bottom:50px;
}

.contact-info{
    display:flex;
    flex-direction:column;
    gap:35px;
}

.contact-item h2{
    font-size:1.2rem;
    font-weight:400;
    margin-bottom:5px;
}

.contact-item p{
    font-size:2rem;
    font-weight:700;
}

.contact-item a{
    color:white;
    text-decoration:none;
}

.contact-item a:hover{
    text-decoration:underline;
}

@media(max-width:768px){

    .contact-section h1{
        font-size:3.5rem;
    }

    .contact-item p{
        font-size:1.4rem;
    }
}
</style>

</head>
<body>

<nav class="navbar">

    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>

</nav>
