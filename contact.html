<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
}

.contact-section{
    min-height:100vh;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.45),
            rgba(0,0,0,0.45)
        ),
        url("1280px-Théodore_GUDIN_-_Le_naufrage.jpg");

    background-size:cover;
    background-position:center;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:white;
}

.contact-section h1{
    font-size:6rem;
    font-weight:900;
    margin-bottom:50px;
}

.contact-info{
    display:flex;
    flex-direction:column;
    gap:35px;
}

.contact-item h2{
    font-size:1.2rem;
    font-weight:400;
    margin-bottom:5px;
}

.contact-item p{
    font-size:2rem;
    font-weight:700;
}

.contact-item a{
    color:white;
    text-decoration:none;
}

.contact-item a:hover{
    text-decoration:underline;
}

@media(max-width:768px){

    .contact-section h1{
        font-size:3.5rem;
    }

    .contact-item p{
        font-size:1.4rem;
    }
}
</style>

</head>
<body>

<section class="contact-section">

    <h1>GET IN TOUCH</h1>

    <div class="contact-info">

        <div class="contact-item">
            <h2>Email</h2>
            <p>
                <a href="mailto:twojmail@gmail.com">
                    ewelinafilipiak99@gmail.com
                </a>
            </p>
        </div>

        <div class="contact-item">
            <h2>GitHub</h2>
            <p>
                <a href="ewelinafilipiak97.github.io" target="_blank">
                    @ewelinafilipiak97
                </a>
            </p>
        </div>

        <div class="contact-item">
            <h2>LinkedIn</h2>
            <p>
                <a href="https://www.linkedin.com/in/ewelina-filipiak-93178b27b/" target="_blank">
                    linkedin.com/in/ewelina-filipiak-93178b27b/
                </a>
            </p>
        </div>

    </div>

</section>

</body>
</html>
