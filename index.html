<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ewelina Filipiak - portfolio</title>
    <style>
body {
    cursor: url("image.png"), auto;
    background: url('Steamship_on_a_moonlit_night_(by_Ivan_Aivazovsky).jpg') no-repeat center center fixed;
    background-size: cover;

    color: white;
    font-family: Arial, sans-serif;

    margin: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    height: 100vh;
}

.container {
    text-align: center;
}
h1 {
    font-size: 90px;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 2px;
}

h2 {
    font-size: 32px;
    font-weight: normal;
    margin-top: 10px;
    margin-bottom: 40px;
}
.nav-box {
    display: flex;
    justify-content: center;
    gap: 40px;
}

.nav-box a {
    color: white;
    text-decoration: none;
    font-size: 28px;
    transition: 0.3s;
}

.nav-box a:hover {
    transform: scale(1.1);
    opacity: 0.7;
}
.flicker {
    animation: flicker 2.5s infinite;
}

@keyframes flicker {
    0%   { opacity: 1; }
    3%   { opacity: 0.2; }
    6%   { opacity: 1; }
    7%   { opacity: 0.3; }
    8%   { opacity: 1; }
    50%  { opacity: 1; }
    52%  { opacity: 0.4; }
    54%  { opacity: 1; }
    100% { opacity: 1; }
}
 </style>
</head>
<body>

<div class="container">

    <h1 class="flicker">Ewelina Filipiak</h1>

    <h2>Unreal Engine 5 Game Developer</h2>

    <div class="nav-box">
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </div>

</div>

</body>
</html>
